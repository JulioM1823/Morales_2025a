name: Provision Notion secrets for matching repositories

on:
  workflow_dispatch:
    inputs:
      recipients:
        description: "JSON mapping of the three matching repositories to their GitHub Actions public keys"
        type: string
        required: true

permissions: {}

jobs:
  seal-existing-token:
    if: github.repository == 'JulioM1823/Morales_2025a' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure native secret encryption is available
        run: |
          if ! python3 -c 'import ctypes.util; raise SystemExit(not ctypes.util.find_library("sodium"))'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libsodium23
          fi
      - name: Encrypt the existing token for the approved matching repositories
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RECIPIENTS_JSON: ${{ inputs.recipients }}
        run: |
          python3 - <<'PY'
          import base64
          import ctypes
          import ctypes.util
          import json
          import os

          recipients = json.loads(os.environ['RECIPIENTS_JSON'])
          expected = {'JulioM1823/Morales_2023', 'JulioM1823/Morales_202xa', 'JulioM1823/Vesa_2026'}
          if set(recipients) != expected:
              raise SystemExit('Recipients must be exactly the three verified matching repositories.')
          library = ctypes.util.find_library('sodium')
          if not library:
              raise SystemExit('Native libsodium is unavailable.')
          sodium = ctypes.CDLL(library)
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          sodium.crypto_box_sealbytes.restype = ctypes.c_size_t
          sodium.crypto_box_publickeybytes.restype = ctypes.c_size_t
          if sodium.sodium_init() < 0:
              raise SystemExit('Secret encryption initialization failed.')

          # Verify the native sealed-box round trip with disposable test data first.
          public = ctypes.create_string_buffer(32)
          private = ctypes.create_string_buffer(32)
          if sodium.crypto_box_keypair(public, private) != 0:
              raise SystemExit('Secret encryption self-test key generation failed.')
          sample = b'notion-rollout-encryption-self-test'
          sealed = ctypes.create_string_buffer(len(sample) + sodium.crypto_box_sealbytes())
          opened = ctypes.create_string_buffer(len(sample))
          sodium.crypto_box_seal_open.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p, ctypes.c_void_p]
          sodium.crypto_box_seal_open.restype = ctypes.c_int
          if (sodium.crypto_box_seal(sealed, sample, len(sample), public) != 0
                  or sodium.crypto_box_seal_open(opened, sealed, len(sealed), public, private) != 0
                  or opened.raw != sample):
              raise SystemExit('Secret encryption self-test failed.')

          token = os.environ.pop('NOTION_TOKEN').encode()
          if not token:
              raise SystemExit('The source repository has no NOTION_TOKEN.')
          for repository, key in recipients.items():
              public_key = base64.b64decode(key['key'], validate=True)
              if len(public_key) != sodium.crypto_box_publickeybytes() or not str(key['key_id']).isdigit():
                  raise SystemExit('Invalid GitHub repository public key.')
              encrypted = ctypes.create_string_buffer(len(token) + sodium.crypto_box_sealbytes())
              if sodium.crypto_box_seal(encrypted, token, len(token), public_key) != 0:
                  raise SystemExit('Repository secret encryption failed.')
              # Only GitHub can decrypt these values with each repository's private key.
              print('SEALED_NOTION_SECRET ' + json.dumps({
                  'repository': repository,
                  'key_id': key['key_id'],
                  'encrypted_value': base64.b64encode(encrypted.raw).decode(),
              }))
          PY
